<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost & Found Management</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --panel: #ffffff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --danger: #dc2626;
        --success: #15803d;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d1d5db;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 20px;
      }

      h1 {
        margin-bottom: 20px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      label {
        font-weight: bold;
        font-size: 0.95rem;
      }

      input, button {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 1rem;
      }

      button {
        cursor: pointer;
        font-weight: bold;
      }

      .primary {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
      }

      .secondary {
        background: #e5e7eb;
        color: var(--text);
      }

      .danger {
        background: var(--danger);
        border-color: var(--danger);
        color: white;
      }

      .status {
        margin-top: 14px;
        min-height: 24px;
        font-weight: bold;
      }

      .success { color: var(--success); }
      .error { color: var(--danger); }

      .search-row {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        border-bottom: 1px solid var(--border);
        padding: 10px;
        text-align: left;
      }

      th {
        background: #f8fafc;
      }

      .badge {
        display: inline-block;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: bold;
      }

      .claimed {
        background: #dcfce7;
        color: var(--success);
      }

      .unclaimed {
        background: #fef3c7;
        color: #92400e;
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 800px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Lost & Found Management</h1>

      <div class="grid">
        <section class="panel">
          <h2>Add Item</h2>
          <form id="item-form">
            <div>
              <label for="item_name">Item Name</label>
              <input id="item_name" name="item_name" required />
            </div>

            <div>
              <label for="category">Category</label>
              <input id="category" name="category" required />
            </div>

            <div>
              <label for="location_found">Location Found</label>
              <input id="location_found" name="location_found" required />
            </div>

            <div>
              <label for="date_found">Date Found</label>
              <input id="date_found" name="date_found" type="date" required />
            </div>

            <button type="submit" class="primary">Add Item</button>
          </form>

          <div id="message" class="status"></div>
        </section>

        <section class="panel">
          <h2>Items</h2>

          <div class="search-row">
            <input id="item-id" type="number" min="1" placeholder="Search by item ID" />
            <button id="search-btn" class="secondary">Search</button>
          </div>

          <button id="load-btn" class="primary" style="margin-bottom: 12px;">View All Items</button>

          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Item</th>
                <th>Category</th>
                <th>Location Found</th>
                <th>Date Found</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="items-table"></tbody>
          </table>
        </section>
      </div>
    </div>

    <script>
      const itemForm = document.getElementById('item-form');
      const itemsTable = document.getElementById('items-table');
      const messageBox = document.getElementById('message');

      function showMessage(text, isError = false) {
        messageBox.textContent = text;
        messageBox.className = `status ${isError ? 'error' : 'success'}`;
      }

      function renderItems(items) {
        if (!Array.isArray(items) || items.length === 0) {
          itemsTable.innerHTML = '<tr><td colspan="7" class="muted">No items found.</td></tr>';
          return;
        }

        itemsTable.innerHTML = items.map((item) => `
          <tr>
            <td>${item.id}</td>
            <td>${item.item_name}</td>
            <td>${item.category}</td>
            <td>${item.location_found}</td>
            <td>${item.date_found}</td>
            <td><span class="badge ${item.claimed ? 'claimed' : 'unclaimed'}">${item.claimed ? 'CLAIMED' : 'UNCLAIMED'}</span></td>
            <td>
              <button class="danger" data-id="${item.id}" type="button" ${item.claimed ? 'disabled' : ''}>Delete</button>
            </td>
          </tr>
        `).join('');

        itemsTable.querySelectorAll('button[data-id]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = Number(button.dataset.id);
            await deleteItem(id);
          });
        });
      }

      async function loadAllItems() {
        try {
          const response = await fetch('/api/items');
          const data = await response.json();
          renderItems(data);
        } catch (error) {
          showMessage('Failed to load items.', true);
        }
      }

      async function searchItem() {
        const id = document.getElementById('item-id').value;

        if (!id) {
          showMessage('Please enter an item ID.', true);
          return;
        }

        try {
          const response = await fetch(`/api/items/${id}`);
          const data = await response.json();

          if (!response.ok) {
            showMessage(data.message || 'Item not found.', true);
            return;
          }

          renderItems([data]);
          showMessage(`Found item #${id}.`);
        } catch (error) {
          showMessage('Search failed.', true);
        }
      }

      async function addItem(event) {
        event.preventDefault();

        const form = new FormData(itemForm);
        const payload = {
          item_name: form.get('item_name'),
          category: form.get('category'),
          location_found: form.get('location_found'),
          date_found: form.get('date_found')
        };

        try {
          const response = await fetch('/api/items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok) {
            showMessage(data.message || 'Could not add item.', true);
            return;
          }

          itemForm.reset();
          showMessage(`Added new item: ${data.item.item_name}`);
          await loadAllItems();
        } catch (error) {
          showMessage('Could not add item.', true);
        }
      }

      async function deleteItem(id) {
        try {
          const response = await fetch(`/api/items/${id}`, { method: 'DELETE' });
          const data = await response.json();

          if (!response.ok) {
            showMessage(data.message || 'Delete failed.', true);
            return;
          }

          showMessage(`Deleted item #${id}.`);
          await loadAllItems();
        } catch (error) {
          showMessage('Delete request failed.', true);
        }
      }

      document.getElementById('search-btn').addEventListener('click', searchItem);
      document.getElementById('load-btn').addEventListener('click', loadAllItems);
      itemForm.addEventListener('submit', addItem);

      loadAllItems();
    </script>
  </body>
</html>
